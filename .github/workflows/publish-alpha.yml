name: Publish Alpha
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  publish_alpha:
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets: inherit
    with:
      branch: 'dev'
      version_file: 'ovos_media_provider_tunein/version.py'
      publish_prerelease: true
      publish_pypi: true
